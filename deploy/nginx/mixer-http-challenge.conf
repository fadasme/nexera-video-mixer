# Temporary vhost used only while issuing the first Let's Encrypt certificate.
# It deliberately does not serve the app over plain HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name mixer.nexera.cl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
